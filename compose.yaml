# Local development stack.
#   docker compose --profile build build     # session + pcap images (first time, and after runner changes)
#   docker compose up --build                # API on http://127.0.0.1:8000, worker, Postgres (pulls the Suricata image)
name: sandbox

x-app-env: &app-env
  SANDBOX_ENV: dev
  SANDBOX_DATABASE_URL: postgresql+asyncpg://sandbox:sandbox@postgres:5432/sandbox
  TEST_DATABASE_URL: postgresql+asyncpg://sandbox:sandbox@postgres:5432/sandbox_test
  SANDBOX_SECRET_KEY: ${SANDBOX_SECRET_KEY:-dev-insecure-secret-change-me}
  SANDBOX_ARTIFACT_ROOT: /data/artifacts
  SANDBOX_QUARANTINE_ROOT: /data/quarantine
  SANDBOX_SESSION_NETWORK: sandbox_sessions
  SANDBOX_SESSION_BRIDGE: sbx-sessions
  SANDBOX_SESSION_SUBNET: 172.31.213.0/24
  SANDBOX_SESSION_API_IP: 172.31.213.2
  # IPv6 on the session network (ULA, NAT66 to the host). auto: sessions get IPv6 only
  # when the egress probe reaches a public IPv6 address; on | off force it.
  SANDBOX_SESSION_IPV6: ${SANDBOX_SESSION_IPV6:-auto}
  SANDBOX_SESSION_SUBNET_V6: fd5b:d213:5e55::/64
  SANDBOX_SESSION_API_IP6: fd5b:d213:5e55::2
  # enforce | warn | off: refuse sessions unless the egress probe passes (NFR-3).
  SANDBOX_EGRESS_GUARD: ${SANDBOX_EGRESS_GUARD:-enforce}
  # Read from .env by compose; blank means that vendor's lookups are disabled.
  SANDBOX_VT_API_KEY: ${SANDBOX_VT_API_KEY:-}
  SANDBOX_ABUSEIPDB_API_KEY: ${SANDBOX_ABUSEIPDB_API_KEY:-}
  # abuse.ch Auth-Key for the URLhaus, ThreatFox and MalwareBazaar feeds.
  SANDBOX_ABUSECH_AUTH_KEY: ${SANDBOX_ABUSECH_AUTH_KEY:-}
  # Suricata over session pcaps, from the Docker Hub image that the suricata-image
  # service pulls. On by default. Set SANDBOX_SURICATA_IMAGE= (empty) in .env to turn it off.
  SANDBOX_SURICATA_IMAGE: ${SANDBOX_SURICATA_IMAGE-jasonish/suricata:7.0}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sandbox
      POSTGRES_PASSWORD: sandbox
      POSTGRES_DB: sandbox
    ports:
      - "${SANDBOX_POSTGRES_BIND:-127.0.0.1}:${SANDBOX_POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # z: on SELinux hosts, relabel this one file so the container may read it
      # (a no-op where SELinux is off).
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sandbox -d sandbox"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      args:
        EXTRAS: "[dev]"
    image: sandbox-api:latest
    environment: *app-env
    ports:
      - "${SANDBOX_API_BIND:-127.0.0.1}:${SANDBOX_API_PORT:-8000}:8000"
    volumes:
      - artifacts:/data/artifacts
      - quarantine:/data/quarantine:ro
    # The live-view proxy reaches session containers on this network (INT-1). Its fixed
    # address is the only one the egress guard lets open connections to sessions.
    networks:
      default: {}
      sessions:
        ipv4_address: 172.31.213.2
        ipv6_address: fd5b:d213:5e55::2
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/ready')"]
      interval: 5s
      timeout: 5s
      retries: 30

  worker:
    image: sandbox-api:latest
    command: ["python", "-m", "sandbox.orchestrator"]
    environment:
      <<: *app-env
      # The worker never holds the Docker socket (SR-19). It reaches Docker only through
      # docker-proxy, which passes the few calls the session backend makes and refuses
      # host mounts, privileged containers and anything outside the sandbox's own
      # containers. The worker runs as the image's non-root user "app".
      SANDBOX_DOCKER_URL: tcp://docker-proxy:2375
    volumes:
      - artifacts:/data/artifacts
      - quarantine:/data/quarantine
    networks:
      default: {}
      docker-api: {}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      data-owner:
        condition: service_completed_successfully
      docker-proxy:
        condition: service_healthy
      egress-guard:
        condition: service_started
      suricata-image:
        condition: service_completed_successfully

  # The only container with the Docker socket. It filters every API call the worker
  # sends (sandbox/dockerproxy.py) and sits on a network that only the worker joins.
  # It runs as root only to open the socket, with no capabilities and a read-only root.
  docker-proxy:
    image: sandbox-api:latest
    command: ["python", "-m", "sandbox.dockerproxy"]
    user: "0:0"
    environment:
      SANDBOX_SESSION_NETWORK: sandbox_sessions
      SANDBOX_SESSION_BRIDGE: sbx-sessions
      # The images the worker may start. Keep in step with the session, pcap and
      # Suricata images above.
      SANDBOX_PROXY_IMAGES: "sandbox-session:latest sandbox-pcap:latest ${SANDBOX_SURICATA_IMAGE-jasonish/suricata:7.0}"
      SANDBOX_PROXY_RUNTIMES: "runc runsc"
    read_only: true
    cap_drop: [ALL]
    # SELinux hosts (openSUSE, Fedora, RHEL with "selinux-enabled": true): a labelled
    # container may not connect to the Docker socket. label=disable lifts SELinux
    # confinement for this container only, and does nothing where SELinux is off.
    # Never relabel the socket with :z or :Z.
    security_opt:
      - label=disable
      - no-new-privileges
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      docker-api: {}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "sandbox.dockerproxy", "--check"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Gives the artifact and quarantine volumes to the worker's user (uid 10001). Earlier
  # releases ran the worker as root, so files it wrote are root's. Exits straight away
  # when nothing needs changing.
  data-owner:
    image: sandbox-api:latest
    user: "0:0"
    entrypoint: ["sh", "-c", "find /data/artifacts /data/quarantine ! -user 10001 -exec chown -h 10001 {} +"]
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH]
    security_opt:
      - no-new-privileges
    volumes:
      - artifacts:/data/artifacts
      - quarantine:/data/quarantine
    restart: "no"

  # Firewall for the session network: sessions reach the public internet only (NFR-3).
  # Runs in the Docker host's network namespace with NET_ADMIN; the worker probes the
  # result and refuses to start sessions if internal targets are reachable.
  egress-guard:
    build:
      context: .
      dockerfile: docker/egress.Dockerfile
    image: sandbox-egress-guard:latest
    network_mode: host
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW]
    environment:
      SANDBOX_SESSION_BRIDGE: sbx-sessions
      SANDBOX_SESSION_API_IP: 172.31.213.2
      SANDBOX_SESSION_API_IP6: fd5b:d213:5e55::2
      # Extra IPv6 CIDRs sessions must not reach, space-separated. On Docker Desktop the
      # guard cannot see the Windows host's addresses: put the office LAN's public IPv6
      # prefix here (the guard already blocks the Docker host's own prefixes).
      SANDBOX_EGRESS_BLOCKED6: ${SANDBOX_EGRESS_BLOCKED6:-}
      # auto | nft | legacy: the iptables backend that holds Docker's DOCKER-USER chain.
      # auto finds it (openSUSE and some others keep iptables on legacy).
      SANDBOX_EGRESS_IPTABLES: ${SANDBOX_EGRESS_IPTABLES:-auto}
    restart: unless-stopped

  # Images the worker starts per session. Built with: docker compose --profile build build
  session-image:
    profiles: [build]
    build:
      context: .
      dockerfile: docker/session.Dockerfile
    image: sandbox-session:latest

  pcap-image:
    profiles: [build]
    build:
      context: .
      dockerfile: docker/pcap.Dockerfile
    image: sandbox-pcap:latest

  # The worker runs Suricata in short-lived containers from this image. `up` pulls it from
  # Docker Hub (if missing) and checks it starts before the worker does. Exits straight away.
  suricata-image:
    image: ${SANDBOX_SURICATA_IMAGE:-jasonish/suricata:7.0}
    pull_policy: missing
    entrypoint: ["suricata", "-V"]
    network_mode: none
    restart: "no"

networks:
  # Worker to docker-proxy only. internal: no route out, and no other service joins it.
  docker-api:
    internal: true
  sessions:
    name: sandbox_sessions
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: sbx-sessions
    # IPv6 is filtered by the egress guard like IPv4. Docker masquerades the ULA subnet
    # (NAT66) out of the host's IPv6 address; without IPv6 routing on the host, the
    # worker keeps sessions IPv4-only (SANDBOX_SESSION_IPV6=auto).
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.31.213.0/24
        - subnet: fd5b:d213:5e55::/64

volumes:
  pgdata:
  artifacts:
  quarantine:
