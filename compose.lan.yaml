# Publishes the API on the LAN as well as on the local address in compose.yaml.
#   docker compose -f compose.yaml -f compose.lan.yaml up -d
# Set SANDBOX_LAN_IP (and SANDBOX_LAN_PORT if 8000 is taken) in .env first.
# Dev auth has no sign-in: anyone who can reach this address can act as admin.
# Do not use this on an untrusted network without a sign-in proxy in front of the API.
services:
  api:
    ports:
      - "${SANDBOX_LAN_IP:?set SANDBOX_LAN_IP in .env to this host's LAN address}:${SANDBOX_LAN_PORT:-8000}:8000"
