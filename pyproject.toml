[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sandbox"
version = "0.1.0"
description = "Internal URL sandbox: detonate links in disposable browsers and report on them"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "idna>=3.7",
    "httpx>=0.27",
    "websockets>=12",
    "docker>=7.1",
    "yara-python>=4.5",
    "tldextract>=5.1",
    "pyzipper>=0.3.6",
    "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
dev = [
    # The runner's browser driver, as in docker/session.Dockerfile, so the runner tests
    # import in CI (the ones that need a real Chromium skip where none is installed).
    "patchright==1.64.4",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["sandbox*"]

[tool.setuptools.package-data]
sandbox = ["db/migrations/*.mako", "db/migrations/*.py", "db/migrations/versions/*.py", "web/*.html", "web/css/*.css", "web/js/*.js", "web/fonts/*", "detections/*.toml", "detections/rules/*/*.kql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["db: needs a reachable PostgreSQL (TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
# Embedded browser JavaScript, and the single-session runner where blocking file I/O is fine.
"sandbox/runner/page_scripts.py" = ["E501"]
# Embedded YARA rule text.
"sandbox/rules/defaults.py" = ["E501"]
"sandbox/runner/**" = ["ASYNC230", "ASYNC240"]
