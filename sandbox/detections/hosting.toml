[high_abuse_tlds]
title = 'Heavily abused generic TLDs'
description = 'Cheap generic TLDs where most registrations seen in phishing and malware reports are abusive (Interisle, Spamhaus). A host under one counts as untrusted: rules read it with host_in(host, list("hosting.high_abuse_tlds")). Keep popular TLDs that real businesses use (.online, .shop, .site) off this list.'
