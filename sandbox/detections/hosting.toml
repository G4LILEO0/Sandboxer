[government_suffix_parts]
title = 'Government suffix parts'
description = 'Public suffix parts that mark a real government (gov.sa, gov.uk, .gov, go.jp, gob.mx).'
type = "words"
values = [
  'go',
  'gob',
  'gouv',
  'gov',
  'govt',
  'gub',
  'guv',
  'gv',
  'mil',
]

[government_token]
title = 'Government-looking host label'
description = 'A host label that dresses up as government (gov, govsa, ksagov ...). Matched against each label of hosts outside a government suffix.'
type = "regex"
flags = ''
pattern = '^(gov|govt|gouv|gob|government)(sa|ksa|uk|us|ae|qa|kw|bh|om|eg|jo|au|ca|in|ma)?$|^(sa|ksa|uk|us|ae|qa|kw|bh|om|eg)(gov|govt)$'

[government_infrastructure]
title = 'Government cloud infrastructure'
description = 'Legitimate non-government hosts that carry a "gov" label (government cloud regions).'
type = "words"
values = [
  'amazonaws.com',
  'azure.us',
  'microsoft.us',
  'usgovcloudapi.net',
  'office365.us',
]

