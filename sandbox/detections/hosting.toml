# Hosting and domains: detection strings read by the fact builders.
# Shipped defaults. Change them in Admin > Detection strings (stored as an
# override, audited, revertible); edit this file only to change what ships.
# Regex syntax is Python re. flags: i = ignore case, s = dot matches newline,
# m = multi-line, x = verbose.

title = 'Hosting and domains'

[free_hosting]
title = 'Free hosting and site-builder platforms'
description = 'Free hosting, site builders, tunnels, IPFS gateways and dynamic DNS: anyone can publish a page under these in minutes, and phishing kits do. Each entry covers its subdomains, and each tenant (kit.pages.dev) is its own site for allowlisting. Order matters: the first entry that matches is reported.'
